<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>

<h1>🛒 My Cart</h1>

<ul id="cart-list"></ul>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let list = document.getElementById("cart-list");

cart.forEach(game => {

    let li = document.createElement("li");

    li.innerText = game;

    list.appendChild(li);

});

</script>

</body>
